# Content-only deploy on push to main (#11, reliability #45).
# Infra (Terraform) is applied out-of-band; this job only syncs static files + invalidates CDN.
name: Deploy site

on:
  push:
    branches: [main]
    # Broad filters so merge commits that touch site content always fire.
    # Exclude terraform/docs-only noise via paths-ignore where possible.
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - "Makefile"
  workflow_dispatch:

concurrency:
  group: deploy-site-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SITE_BUCKET: estesadvisory.com
  CLOUDFRONT_DISTRIBUTION_ID: ER3NN8S5BKILJ

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No GitHub Environment gate — env protection previously correlated with long queue/cancel (#45).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public brand guard (blocklist)
        run: bash scripts/brand-guard.sh

      - name: Stamp footer build identity
        run: bash scripts/stamp-build.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync allowlisted site files to S3
        run: |
          set -euo pipefail
          # Exclude ops/* by default (private dashboard). Set repo var OPS_SYNC=true after CF Basic Auth.
          OPS_EXTRA=()
          if [ "${{ vars.OPS_SYNC }}" = "true" ]; then
            OPS_EXTRA=(--include "ops/*" --include "ops/*/*" --include "ops/*/*/*")
          fi
          aws s3 sync ./ "s3://${SITE_BUCKET}/" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "css/*" \
            --include "js/*" \
            --include "assets/*" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --include "favicon.ico" \
            --include "site.webmanifest" \
            --exclude "ops/*" \
            --exclude "ops/*/*" \
            --exclude "ops/*/*/*" \
            "${OPS_EXTRA[@]}" \
            --cache-control "public,max-age=300,must-revalidate"

          aws s3 cp "s3://${SITE_BUCKET}/" "s3://${SITE_BUCKET}/" --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --cache-control "public,max-age=300,must-revalidate" \
            --content-type "text/html; charset=utf-8"

          aws s3 cp "s3://${SITE_BUCKET}/robots.txt" "s3://${SITE_BUCKET}/robots.txt" \
            --metadata-directive REPLACE \
            --cache-control "public,max-age=300,must-revalidate" \
            --content-type "text/plain; charset=utf-8"

          aws s3 cp "s3://${SITE_BUCKET}/sitemap.xml" "s3://${SITE_BUCKET}/sitemap.xml" \
            --metadata-directive REPLACE \
            --cache-control "public,max-age=300,must-revalidate" \
            --content-type "application/xml; charset=utf-8"

          if [ -d css ]; then
            aws s3 cp "s3://${SITE_BUCKET}/css/" "s3://${SITE_BUCKET}/css/" --recursive \
              --metadata-directive REPLACE \
              --cache-control "public,max-age=300,must-revalidate" \
              --content-type "text/css; charset=utf-8"
          fi
          if [ -d js ]; then
            aws s3 cp "s3://${SITE_BUCKET}/js/" "s3://${SITE_BUCKET}/js/" --recursive \
              --metadata-directive REPLACE \
              --cache-control "public,max-age=300,must-revalidate" \
              --content-type "application/javascript; charset=utf-8"
          fi

          # Private /ops dashboard — only when OPS_SYNC=true (after CF Basic Auth)
          if [ "${{ vars.OPS_SYNC }}" = "true" ] && [ -d ops ]; then
            aws s3 cp "s3://${SITE_BUCKET}/ops/" "s3://${SITE_BUCKET}/ops/" --recursive \
              --exclude "*" --include "*.html" \
              --metadata-directive REPLACE \
              --cache-control "private,no-store" \
              --content-type "text/html; charset=utf-8"
            aws s3 cp "s3://${SITE_BUCKET}/ops/" "s3://${SITE_BUCKET}/ops/" --recursive \
              --exclude "*" --include "*.css" \
              --metadata-directive REPLACE \
              --cache-control "private,no-store" \
              --content-type "text/css; charset=utf-8"
            aws s3 cp "s3://${SITE_BUCKET}/ops/" "s3://${SITE_BUCKET}/ops/" --recursive \
              --exclude "*" --include "*.js" \
              --metadata-directive REPLACE \
              --cache-control "private,no-store" \
              --content-type "application/javascript; charset=utf-8"
            aws s3 cp "s3://${SITE_BUCKET}/ops/" "s3://${SITE_BUCKET}/ops/" --recursive \
              --exclude "*" --include "*.json" \
              --metadata-directive REPLACE \
              --cache-control "private,no-store" \
              --content-type "application/json; charset=utf-8"
            aws s3 cp "s3://${SITE_BUCKET}/ops/" "s3://${SITE_BUCKET}/ops/" --recursive \
              --exclude "*" --include "*.md" \
              --metadata-directive REPLACE \
              --cache-control "private,no-store" \
              --content-type "text/markdown; charset=utf-8"
          fi

          # Correct types for root favicon / manifest when present
          if [ -f favicon.ico ]; then
            aws s3 cp favicon.ico "s3://${SITE_BUCKET}/favicon.ico" \
              --content-type "image/x-icon" \
              --cache-control "public,max-age=31536000,immutable"
          fi
          if [ -f site.webmanifest ]; then
            aws s3 cp site.webmanifest "s3://${SITE_BUCKET}/site.webmanifest" \
              --content-type "application/manifest+json" \
              --cache-control "public,max-age=300,must-revalidate"
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
